name: Linux Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget curl tar gzip bzip2 xz-utils \
            libfuse2 fuse3 \
            rpm alien dpkg-dev \
            squashfs-tools file desktop-file-utils

      - name: Install appimagetool (from GitHub releases)
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          # Extract to avoid FUSE dependency in CI
          ./appimagetool --appimage-extract > /dev/null 2>&1
          sudo mv squashfs-root/usr/bin/appimagetool* /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          appimagetool --version

      - name: Download Firefox ESR 128
        run: |
          mkdir -p firefox
          wget -q "https://archive.mozilla.org/pub/firefox/releases/128.0/linux-x86_64/en-US/firefox-128.0.tar.bz2" -O firefox-esr.tar.bz2
          tar -xjf firefox-esr.tar.bz2 -C firefox --strip-components=1

      - name: Download KoboldCpp Linux
        run: |
          mkdir -p koboldcpp
          wget -q "https://github.com/LostRuins/koboldcpp/releases/download/v1.120/koboldcpp-linux-x64-nocuda" -O koboldcpp/koboldcpp
          chmod +x koboldcpp/koboldcpp

      - name: Prepare AppDir
        run: |
          APPVER="${GITHUB_REF_NAME#v}"
          mkdir -p FoxAI-Browser.AppDir/usr/bin
          mkdir -p FoxAI-Browser.AppDir/usr/share/applications
          mkdir -p FoxAI-Browser.AppDir/usr/share/icons/hicolor/256x256/apps

          # Firefox + built-in config dirs
          cp -r firefox FoxAI-Browser.AppDir/
          mkdir -p FoxAI-Browser.AppDir/firefox/defaults/pref
          mkdir -p FoxAI-Browser.AppDir/firefox/distribution/extensions

          # Locked prefs -> firefox/defaults/pref (auto-loaded by Firefox)
          cp config/foxai.cfg FoxAI-Browser.AppDir/firefox/defaults/pref/foxai.cfg

          # Branding + enterprise policies
          cp config/distribution.ini FoxAI-Browser.AppDir/firefox/distribution/distribution.ini
          cp config/policies.json FoxAI-Browser.AppDir/firefox/distribution/policies.json
          cp linux/resources/distribution/extensions/*.xpi FoxAI-Browser.AppDir/firefox/distribution/extensions/

          # Render %%CORE%%/%%SEARCH%%/%%AI%%/%%UBLOCK%% placeholders -> file:// paths
          EXT="$(pwd)/FoxAI-Browser.AppDir/firefox/distribution/extensions"
          sed -i "s|%%CORE%%|file:///$EXT/foxai-core@foxai.browser.xpi|g" FoxAI-Browser.AppDir/firefox/distribution/policies.json
          sed -i "s|%%SEARCH%%|file:///$EXT/foxai-search-startpage@foxai.local.xpi|g" FoxAI-Browser.AppDir/firefox/distribution/policies.json
          sed -i "s|%%AI%%|file:///$EXT/foxai-ai@foxai.browser.xpi|g" FoxAI-Browser.AppDir/firefox/distribution/policies.json
          sed -i "s|%%UBLOCK%%|file:///$EXT/uBlock0@raymondhill.net.xpi|g" FoxAI-Browser.AppDir/firefox/distribution/policies.json

          # Update distribution.ini version to match tag
          sed -i "s|^version=.*|version=$APPVER|" FoxAI-Browser.AppDir/firefox/distribution/distribution.ini

          # Empty profile + config (launcher syncs user.js on every run)
          mkdir -p FoxAI-Browser.AppDir/profile
          cp -r config FoxAI-Browser.AppDir/config

          # KoboldCpp (model NOT bundled - downloaded on first --offline run)
          cp -r koboldcpp FoxAI-Browser.AppDir/
          rm -f FoxAI-Browser.AppDir/koboldcpp/*.gguf

          # Launcher
          cp linux/foxai-launcher.sh FoxAI-Browser.AppDir/foxai-launcher.sh
          chmod +x FoxAI-Browser.AppDir/foxai-launcher.sh

          # AppRun (entry point)
          cat > FoxAI-Browser.AppDir/AppRun << "EOF"
          #!/bin/bash
          cd "$(dirname "$0")"
          exec ./foxai-launcher.sh "$@"
          EOF
          chmod +x FoxAI-Browser.AppDir/AppRun

          # Desktop file
          cp linux/foxai-browser.desktop FoxAI-Browser.AppDir/foxai-browser.desktop

          # Icon (PNG for appimagetool/desktop-file-validate)
          cp linux/resources/icons/hicolor/256x256/apps/foxai-browser.png FoxAI-Browser.AppDir/foxai-browser.png
          cp linux/resources/icons/hicolor/256x256/apps/foxai-browser.png FoxAI-Browser.AppDir/usr/share/icons/hicolor/256x256/apps/foxai-browser.png
          ln -sf foxai-browser.png FoxAI-Browser.AppDir/.DirIcon

          # Version file (launcher reads this)
          echo "$APPVER" > FoxAI-Browser.AppDir/version.txt

      - name: Build AppImage
        run: |
          ARCH=x86_64 appimagetool FoxAI-Browser.AppDir FoxAI-Browser-${{ github.ref_name }}.AppImage

      - name: Build RPM
        run: |
          APPVER="${GITHUB_REF_NAME#v}"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp FoxAI-Browser-${{ github.ref_name }}.AppImage rpmbuild/SOURCES/FoxAI-Browser-$APPVER.AppImage
          cp linux/foxai-browser.desktop rpmbuild/SOURCES/
          cp linux/resources/icons/hicolor/256x256/apps/foxai-browser.png rpmbuild/SOURCES/
          cp linux/foxai-browser.spec rpmbuild/SPECS/
          sed -i "s|^Version:.*|Version: $APPVER|" rpmbuild/SPECS/foxai-browser.spec
          rpmbuild -ba rpmbuild/SPECS/foxai-browser.spec --define "_topdir $(pwd)/rpmbuild"

      - name: Build DEB
        run: |
          APPVER="${GITHUB_REF_NAME#v}"
          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/bin
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps

          cp linux/deb/DEBIAN/control deb/DEBIAN/control
          cp FoxAI-Browser-${{ github.ref_name }}.AppImage deb/usr/bin/foxai-browser
          chmod +x deb/usr/bin/foxai-browser
          cp linux/foxai-browser.desktop deb/usr/share/applications/
          cp linux/resources/icons/hicolor/256x256/apps/foxai-browser.png deb/usr/share/icons/hicolor/256x256/apps/foxai-browser.png

          # Set version to match tag
          sed -i "s|^Version:.*|Version: $APPVER-1|" deb/DEBIAN/control

          # Calculate installed size
          SIZE=$(du -sk deb | cut -f1)
          sed -i "s/Installed-Size:.*/Installed-Size: $SIZE/" deb/DEBIAN/control

          dpkg-deb --build deb foxai-browser-${{ github.ref_name }}-amd64.deb

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FoxAI-Browser-${{ github.ref_name }}.AppImage
            rpmbuild/RPMS/x86_64/foxai-browser-*.rpm
            foxai-browser-${{ github.ref_name }}-amd64.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}