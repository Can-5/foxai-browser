<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191524"/>
      <stop offset="1" stop-color="#0D0A14"/>
    </linearGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF4D6D"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="114.5" ry="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- Left ear -->
  <path d="M 152 212 L 88 76 L 240 140 Z" fill="url(#fox)"/>
  <!-- Right ear -->
  <path d="M 360 212 L 424 76 L 272 140 Z" fill="url(#fox)"/>

  <!-- Face -->
  <path d="M 256 132
           C 196 132, 152 176, 144 224
           C 116 236, 108 272, 128 304
           C 152 344, 208 356, 256 356
           C 304 356, 360 344, 384 304
           C 404 272, 396 236, 368 224
           C 360 176, 316 132, 256 132 Z" fill="url(#fox)"/>

  <!-- Muzzle -->
  <path d="M 256 252
           C 196 252, 184 296, 196 322
           C 208 348, 232 358, 256 358
           C 280 358, 304 348, 316 322
           C 328 296, 316 252, 256 252 Z" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M 232 266
           Q 256 256, 280 266
           Q 288 286, 256 298
           Q 224 286, 232 266 Z" fill="#120D18"/>

  <!-- Eyes -->
  <circle cx="202" cy="244" r="14" fill="#120D18"/>
  <circle cx="310" cy="244" r="14" fill="#120D18"/>

  <!-- AI glow -->
  <circle cx="242" cy="222" r="22" fill="url(#ai)" fill-opacity="0.35"/>
  <!-- AI sparkle (four-point star) -->
  <path d="M 242 204
           C 244 214, 250 220, 260 222
           C 250 224, 244 230, 242 240
           C 240 230, 234 224, 224 222
           C 234 220, 240 214, 242 204 Z" fill="#FFFFFF"/>
  <circle cx="230" cy="214" r="4" fill="#FFFFFF"/>
  <circle cx="256" cy="240" r="3.2" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
