<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="../foxai-mark.svg">
  <link rel="stylesheet" href="startpage.css">
  <title>FoxAI Start</title>
</head>
<body>
  <div class="card">
    <img class="logo" src="../foxai-mark.svg" alt="FoxAI">
    <h1>FoxAI Start</h1>
    <p class="sub">Private search. No tracking. DuckDuckGo backed.</p>
    <form id="f">
      <input type="text" id="q" placeholder="Search the web privately…" autofocus autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <p class="version" id="ver"></p>
  </div>
  <script src="startpage.js"></script>
</body>
</html>
