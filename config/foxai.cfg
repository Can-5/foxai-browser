pref("network.http.connection-timeout", 60);
pref("network.http.request.max-start-delay", 0);
pref("network.dnsCacheEntries", 2000);
pref("network.dnsCacheExpiration", 3600);

// ---- Performance: cache ----
pref("browser.cache.disk.capacity", 524288);
pref("browser.cache.disk.smart_size.enabled", false);
pref("browser.cache.memory.capacity", 131072);

// ---- Performance: JS / render ----
pref("dom.max_chrome_script_run_time", 0);
pref("layers.acceleration.force-enabled", true);
pref("browser.display.auto_quality_min_font_size", 14);
pref("browser.display.document_color_use", 2);

// ---- Memory (lower RAM) ----
pref("dom.ipc.processCount", 8);
pref("dom.ipc.keepProcessAliveInBackground", 5);
pref("browser.low_commit_space_threshold_mb", 256);
pref("browser.low_commit_space_threshold_percent", 75);

// ---- Dark UI ----
pref("browser.theme.content-theme", 2);
pref("browser.theme.toolbar-theme", 2);
pref("layout.css.prefers-color-scheme.content-override", 2);
pref("browser.uidensity", 1);
pref("browser.compactmode.show", true);
pref("sidebar.verticalTabs", true);

// ---- userChrome.css active ----
pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// ---- Containers Pro ----
pref("privacy.userContext.enabled", true);
pref("privacy.userContext.ui.enabled", true);

// ---- Media lockdown ----
pref("media.autoplay.default", 5);
pref("permissions.default.camera", 2);
