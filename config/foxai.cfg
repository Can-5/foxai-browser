pref("toolkit.startup.max_resumed_crashes", 0);
pref("browser.sessionstore.interval", 60000);
pref("browser.sessionstore.max_tabs_undo", 5);
pref("browser.sessionstore.max_windows_undo", 2);
pref("browser.sessionstore.max_serialize_back", 0);
pref("browser.sessionstore.max_serialize_forward", 0);
pref("browser.sessionhistory.max_entries", 30);
pref("browser.startup.page", 0);
pref("browser.warnOnQuit", false);

// ---- URL bar (privacy) ----
pref("browser.urlbar.suggest.quicksuggest.sponsored", false);
pref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
pref("browser.urlbar.suggest.searches", false);
pref("browser.urlbar.suggest.topsites", false);
pref("browser.urlbar.suggest.bookmark", false);
pref("browser.urlbar.suggest.history", false);
pref("browser.urlbar.suggest.openpage", false);
pref("browser.urlbar.maxRichResults", 0);
pref("browser.urlbar.autoFill", false);
pref("browser.urlbar.trimURLs", false);
pref("browser.search.suggest.enabled.private", false);

// ---- Security ----
pref("security.tls.enable_0rtt_data", false);
pref("security.cert_pinning.enforcement_level", 2);
pref("security.ssl.require_safe_negotiation", true);
pref("security.ssl.treat_unsafe_negotiation_as_broken", true);
pref("security.OCSP.require", true);
pref("network.auth.subresource-http-auth-allow", 1);
pref("network.lna.enabled", true);
pref("security.dialog_enable_delay", 1000);
pref("pdfjs.enableScripting", false);
pref("browser.helperApps.deleteTempFileOnExit", true);
pref("browser.download.alwaysOpenPanel", false);
pref("browser.download.always_ask_before_handling_new_types", true);
pref("browser.download.open_pdf_attachments_inline", false);

// ---- Performance: startup ----
