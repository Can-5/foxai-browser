// FoxAI Browser - locked defaults (firefox.cfg equivalent loaded from defaults\pref\foxai.cfg)
pref("xpinstall.signatures.required", false);
pref("extensions.installDistroAddons", true);
pref("extensions.autoDisableScopes", 0);
pref("privacy.trackingprotection.enabled", true);
pref("privacy.trackingprotection.socialtracking.enabled", true);
pref("privacy.trackingprotection.cryptomining.enabled", true);
pref("privacy.trackingprotection.fingerprinting.enabled", true);
pref("privacy.fingerprintingProtection", true);
pref("privacy.fingerprintingProtection.pbmode", true);
pref("browser.newtabpage.activity-stream.enabled", false);
pref("datareporting.policy.dataSubmissionEnabled", false);
pref("browser.search.suggest.enabled", false);

// ---- privacy hardening ----
pref("extensions.formautofill.addresses.enabled", false);
pref("extensions.formautofill.creditCards.enabled", false);
pref("browser.formfill.enable", false);
pref("network.prefetch-next", false);
pref("network.predictor.enabled", false);
pref("network.dns.disablePrefetch", true);
pref("network.http.referer.defaultPolicy", 0);
pref("network.http.referer.trimmingPolicy", 2);
pref("network.http.referer.sendRefererHeader", 0);
pref("beacon.enabled", false);
pref("browser.send_pings", false);
pref("device.sensors.enabled", false);
pref("dom.battery.enabled", false);
pref("media.navigator.enabled", false);
pref("media.peerconnection.enabled", false);
pref("privacy.firstparty.isolate", true);
pref("network.IDN_show_punycode", true);
pref("dom.security.https_only_mode", true);
pref("network.dns.echconfig.enabled", true);
pref("network.http.echconfig.enabled", true);
pref("extensions.pocket.enabled", false);
pref("signon.rememberSignons", false);
pref("browser.uitour.enabled", false);
pref("browser.tabs.crashReporting.sendReport", false);

// ---- Firefox-fork hardening (LibreWolf / Arkenfox style) ----
pref("privacy.resistFingerprinting.letterboxing", true);
pref("privacy.trackingprotection.emailtracking.enabled", true);
pref("network.cookie.cookieBehavior", 5);
pref("privacy.sanitize.sanitizeOnShutdown", true);
pref("privacy.clearOnShutdown.cache", true);
pref("privacy.clearOnShutdown.cookies", false);
pref("privacy.clearOnShutdown.downloads", false);
pref("privacy.clearOnShutdown.formdata", true);
pref("privacy.clearOnShutdown.history", true);
pref("privacy.clearOnShutdown.offlineApps", false);
pref("privacy.clearOnShutdown.sessions", true);
pref("privacy.clearOnShutdown.siteSettings", false);
pref("webgl.disabled", true);
pref("media.eme.enabled", false);
pref("browser.pagethumbnails.capturing_disabled", true);
pref("browser.cache.disk_cache_ssl", false);
pref("browser.download.useDownloadDir", false);
pref("toolkit.telemetry.enabled", false);
pref("toolkit.telemetry.unified", false);
pref("datareporting.healthreport.uploadEnabled", false);
pref("browser.newtabpage.activity-stream.feeds.telemetry", false);
pref("browser.ping-centre.telemetry", false);
pref("breakpad.reportURL", "");
pref("browser.sessionstore.privacy_level", 2);

// ---- Tab behaviour (fork style) ----
pref("browser.tabs.insertAfterCurrent", true);
pref("browser.tabs.loadDivertedInBackground", true);
pref("browser.tabs.closeWindowWithLastTab", false);
pref("browser.tabs.warnOnOpen", false);
pref("browser.tabs.unloadOnLowMemory", true);
pref("browser.tabs.allowTabDetach", true);
pref("browser.sessionstore.restore_on_demand", true);
pref("browser.sessionstore.resume_from_crash", false);
